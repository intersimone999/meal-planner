<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}menuapp{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
  <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
</head>
<body>
  <header>
    <nav>
      <a href="/">Home</a>
      <a href="/recipes">Ricette</a>
      <a href="/ingredients">Ingredienti</a>
      <a href="/planner">Piano</a>
      <a href="/mealplans">Modelli</a>
      <a href="/shopping">Spesa</a>
      <a href="/import">Import/Export</a>
      {% if not is_auth_bypassed() %}
        <form method="post" action="/logout" class="logout-form">
          <button type="submit" class="button">Esci</button>
        </form>
      {% endif %}
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
