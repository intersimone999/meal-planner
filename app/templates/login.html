<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Accedi — menuapp</title>
  <link rel="preconnect" href="https://rsms.me/">
  <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}?v={{ static_v('style.css') }}">
</head>
<body class="login-page">
  <div class="login-card">
    <h1>menuapp</h1>
    {% if bypassed %}
      <p class="hint">Autenticazione disattivata (modalità sviluppo). Premi «Accedi» per continuare.</p>
    {% endif %}
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post" action="/login" class="form-stack">
      <input type="hidden" name="next" value="{{ next }}">
      <div>
        <label for="u">Utente</label>
        <input id="u" type="text" name="username" autofocus autocomplete="username" {% if not bypassed %}required{% endif %}>
      </div>
      <div>
        <label for="p">Password</label>
        <input id="p" type="password" name="password" autocomplete="current-password" {% if not bypassed %}required{% endif %}>
      </div>
      <div class="form-actions">
        <button type="submit" class="button primary" style="flex:1;justify-content:center">Accedi</button>
      </div>
    </form>
  </div>
</body>
</html>
