<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Accedi — menuapp</title>
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body class="login-page">
  <main class="login-box">
    <h1>menuapp</h1>
    {% if bypassed %}
      <p class="hint">Autenticazione disattivata (modalità sviluppo). Premi «Accedi» per continuare.</p>
    {% endif %}
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post" action="/login" class="recipe-form">
      <input type="hidden" name="next" value="{{ next }}">
      <label>
        Utente
        <input type="text" name="username" autofocus autocomplete="username" {% if not bypassed %}required{% endif %}>
      </label>
      <label>
        Password
        <input type="password" name="password" autocomplete="current-password" {% if not bypassed %}required{% endif %}>
      </label>
      <div class="actions">
        <button type="submit" class="button primary">Accedi</button>
      </div>
    </form>
  </main>
</body>
</html>
