<td class="cell {% if entries %}filled{% else %}empty{% endif %}" id="tcell-{{ day }}-{{ slot }}">
  {% if entries %}
    <ul class="dish-list">
      {% for e in entries %}
        <li class="dish">
          <span class="dish-type type-{{ e.recipe.type }}" title="{{ type_label(e.recipe.type) }}"><span class="type-emoji">{{ type_emoji(e.recipe.type) }}</span><span class="type-label"> {{ type_label(e.recipe.type) }}</span></span>
          <a class="dish-name" href="{{ root_path }}/recipes/{{ e.recipe.id }}/edit">{{ e.recipe.name }}</a>
          <button class="dish-remove"
                  hx-delete="{{ root_path }}/mealplans/{{ template_id }}/cell/{{ day }}/{{ slot }}/{{ e.recipe_id }}"
                  hx-target="#tcell-{{ day }}-{{ slot }}"
                  hx-swap="outerHTML"
                  title="Rimuovi">
            <svg class="icon"><use href="#i-x"/></svg>
          </button>
        </li>
      {% endfor %}
    </ul>
    <button class="cell-add-more"
            hx-get="{{ root_path }}/mealplans/{{ template_id }}/cell/{{ day }}/{{ slot }}/edit"
            hx-target="#tcell-{{ day }}-{{ slot }}"
            hx-swap="outerHTML"
            title="Aggiungi un altro piatto">
      <svg class="icon"><use href="#i-plus"/></svg> Aggiungi
    </button>
  {% else %}
    <button class="cell-add"
            hx-get="{{ root_path }}/mealplans/{{ template_id }}/cell/{{ day }}/{{ slot }}/edit"
            hx-target="#tcell-{{ day }}-{{ slot }}"
            hx-swap="outerHTML"
            title="Aggiungi una ricetta">+</button>
  {% endif %}
</td>
