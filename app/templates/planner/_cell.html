{% set _day = day if day is defined else d %}
<td class="cell {% if meal %}filled{% else %}empty{% endif %}" id="cell-{{ _day }}-{{ slot }}">
  {% if meal %}
    <a class="cell-recipe" href="/recipes/{{ meal.recipe.id }}/edit">{{ meal.recipe.name }}</a>
    <button class="cell-remove"
            hx-delete="/planner/{{ year }}/{{ week }}/{{ _day }}/{{ slot }}"
            hx-target="#cell-{{ _day }}-{{ slot }}"
            hx-swap="outerHTML"
            title="Rimuovi">×</button>
  {% else %}
    <button class="cell-add"
            hx-get="/planner/{{ year }}/{{ week }}/{{ _day }}/{{ slot }}/edit"
            hx-target="#cell-{{ _day }}-{{ slot }}"
            hx-swap="outerHTML"
            title="Aggiungi una ricetta">+</button>
  {% endif %}
</td>
