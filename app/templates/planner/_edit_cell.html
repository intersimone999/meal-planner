<td class="cell editing" id="cell-{{ day }}-{{ slot }}">
  {% if meals %}
    <ul class="dish-list">
      {% for m in meals %}
        <li class="dish existing">
          <span class="dish-type type-{{ m.recipe.type }}">{{ type_label(m.recipe.type) }}</span>
          <span class="dish-name">{{ m.recipe.name }}</span>
        </li>
      {% endfor %}
    </ul>
  {% endif %}

  {% if recipes %}
    <form hx-post="/planner/{{ year }}/{{ week }}/{{ day }}/{{ slot }}"
          hx-target="#cell-{{ day }}-{{ slot }}"
          hx-swap="outerHTML"
          class="cell-edit-form">
      <select name="recipe_id" autofocus required>
        <option value="">— scegli —</option>
        {% for r in recipes %}
          <option value="{{ r.id }}">{{ type_label(r.type) }} · {{ r.name }}</option>
        {% endfor %}
      </select>
      <div class="cell-actions">
        <button type="submit" class="button primary">Aggiungi</button>
        <button type="button" class="button"
                hx-get="/planner/{{ year }}/{{ week }}/{{ day }}/{{ slot }}"
                hx-target="#cell-{{ day }}-{{ slot }}"
                hx-swap="outerHTML">Chiudi</button>
      </div>
    </form>
  {% else %}
    <p class="hint" style="margin:0.5rem 0">Nessun'altra ricetta disponibile.</p>
    <button class="button"
            hx-get="/planner/{{ year }}/{{ week }}/{{ day }}/{{ slot }}"
            hx-target="#cell-{{ day }}-{{ slot }}"
            hx-swap="outerHTML">Chiudi</button>
  {% endif %}
</td>
