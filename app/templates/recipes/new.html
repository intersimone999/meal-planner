{% extends "base.html" %}
{% block title %}Nuova ricetta — Meal Planner{% endblock %}
{% block content %}
  <div class="page-header">
    <h1>Nuova ricetta</h1>
  </div>

  {% if error %}<div class="error">{{ error }}</div>{% endif %}

  <div class="card">
    <form method="post" action="/recipes" class="form-stack">
      <div>
        <label for="name">Nome</label>
        <input id="name" type="text" name="name" value="{{ name or '' }}" required autofocus maxlength="200" placeholder="es. Pasta al pesto">
      </div>
      <div>
        <label>Tipo</label>
        <div class="type-picker" role="radiogroup" aria-label="Tipo ricetta">
          {% for t in types %}
            <label class="type-tag">
              <input type="radio" name="type" value="{{ t }}" {% if type == t %}checked{% endif %} required>
              <span class="type-tag-label type-{{ t }}">{{ type_emoji(t) }} {{ type_labels[t] }}</span>
            </label>
          {% endfor %}
        </div>
      </div>
      <div>
        <label for="notes">Note <span class="hint">(opzionale)</span></label>
        <textarea id="notes" name="notes" rows="4">{{ notes or '' }}</textarea>
      </div>
      <div class="form-actions">
        <button type="submit" class="button primary">Salva e continua</button>
        <a class="button" href="/recipes">Annulla</a>
      </div>
    </form>
    <p class="hint" style="margin-top:1rem">Dopo il salvataggio potrai aggiungere gli ingredienti.</p>
  </div>
{% endblock %}
