<li id="derived-{{ ing.id }}" class="{% if checked %}checked{% endif %}">
  <button class="check-btn"
          hx-post="/shopping/{{ year }}/{{ week }}/toggle/{{ ing.id }}"
          hx-target="#derived-{{ ing.id }}"
          hx-swap="outerHTML"
          title="{% if checked %}Segna come da comprare{% else %}Segna come preso{% endif %}">
    <svg class="icon"><use href="#i-check"/></svg>
  </button>
  {% set e = ing_emoji(ing.name) %}
  <span class="name">{% if e %}{{ e }} {% endif %}{{ ing.name }}</span>
</li>
