<li id="manual-{{ item.id }}" class="{% if item.checked %}checked{% endif %}">
  <button class="check-btn"
          hx-post="/shopping/manual/{{ item.id }}/toggle"
          hx-target="#manual-{{ item.id }}"
          hx-swap="outerHTML"
          title="{% if item.checked %}Segna come da comprare{% else %}Segna come preso{% endif %}">
    <svg class="icon"><use href="#i-check"/></svg>
  </button>
  {% set e = ing_emoji(item.name) %}
  <span class="name">{% if e %}{{ e }} {% endif %}{{ item.name }}</span>
  <button class="remove-btn"
          hx-delete="/shopping/manual/{{ item.id }}"
          hx-target="#manual-{{ item.id }}"
          hx-swap="outerHTML"
          hx-confirm="Rimuovere «{{ item.name }}»?"
          title="Rimuovi">
    <svg class="icon"><use href="#i-x"/></svg>
  </button>
</li>
